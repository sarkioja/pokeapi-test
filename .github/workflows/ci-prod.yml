name: CI — Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint + Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokeapi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: pokeapi_dev
      API_KEYS: ci-test-key
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
      VIACEP_BASE_URL: https://viacep.com.br/ws
      POKEMON_TTL_HOURS: 24
      POKEMON_TYPE_TTL_DAYS: 7
      HTTP_TIMEOUT_MS: 5000
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm run test:unit

      - name: Enable uuid-ossp extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d pokeapi_dev \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Apply migrations
        run: npm run migration:run

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

  build-validate:
    name: Build Docker Image (validate)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false

  build-and-push:
    name: Build Docker Image → GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-prod:
    name: Deploy → Render (main)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" \
            -o /dev/null -w "%{http_code}" | grep -q "^2" \
            && echo "Deploy triggered" || echo "Deploy hook returned non-2xx (check Render dashboard)"
