name: CI — Feature

on:
  push:
    branches:
      - 'feature/**'

jobs:
  lint-and-unit:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm run test:unit
