name: CI — Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Lint + Full Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokeapi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: pokeapi_dev
      API_KEYS: ci-test-key
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
      VIACEP_BASE_URL: https://viacep.com.br/ws
      POKEMON_TTL_HOURS: 24
      POKEMON_TYPE_TTL_DAYS: 7
      HTTP_TIMEOUT_MS: 5000
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit tests
        run: npm run test:unit

      - name: Enable uuid-ossp extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d pokeapi_dev \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Apply migrations
        run: npm run migration:run

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

  deploy-dev:
    name: Deploy → Render (develop)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}" \
            -o /dev/null -w "%{http_code}" | grep -q "^2" \
            && echo "Deploy triggered" || echo "Deploy hook returned non-2xx (check Render dashboard)"
