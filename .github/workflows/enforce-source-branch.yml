name: Enforce source branch for main

on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only develop can target main
        if: github.head_ref != 'develop'
        run: |
          echo "PRs to main must come from the develop branch."
          echo "Source branch: ${{ github.head_ref }}"
          exit 1
